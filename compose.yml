services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yadori
      POSTGRES_PASSWORD: yadori
      POSTGRES_DB: yadori
    ports:
      - "5432:5432"
    volumes:
      - yadori-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yadori"]
      interval: 3s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8180:8080"
    volumes:
      - ./auth/realms:/opt/keycloak/data/import:ro

volumes:
  yadori-db:

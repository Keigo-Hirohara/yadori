name: yadori

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yadori
      POSTGRES_PASSWORD: ${DB_PASSWORD:?~/.config/yadori/.env に DB_PASSWORD を設定してください}
      POSTGRES_DB: yadori
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yadori"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        psql -h db -U yadori -d yadori -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 \
          || createdb -h db -U yadori -O yadori keycloak

  realm-render:
    image: alpine:3.21
    volumes:
      - ../auth/realms:/in:ro
      - realms:/out
    command:
      - sh
      - -c
      - |
        for f in /in/*.json; do
          sed -e "s#http://localhost:5173#${ADMIN_ORIGIN:?~/.config/yadori/.env に ADMIN_ORIGIN を設定してください}#g" -e "s#http://localhost:5174#${BOOKER_ORIGIN:?~/.config/yadori/.env に BOOKER_ORIGIN を設定してください}#g" -e 's#"directAccessGrantsEnabled": true#"directAccessGrantsEnabled": false#g' "$$f" > "/out/$$(basename "$$f")"
        done

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?~/.config/yadori/.env に KC_ADMIN_PASSWORD を設定してください}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: yadori
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${AUTH_ORIGIN:?~/.config/yadori/.env に AUTH_ORIGIN を設定してください}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - realms:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
      realm-render:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  migrate:
    build: ../server
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://yadori:${DB_PASSWORD}@db:5432/yadori?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ../server
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://yadori:${DB_PASSWORD}@db:5432/yadori?sslmode=disable
      ALLOWED_ORIGINS: ${BOOKER_ORIGIN},${ADMIN_ORIGIN}
      BOOKER_ISSUER: ${AUTH_ORIGIN}/realms/yadori-booker
      OPERATOR_ISSUER: ${AUTH_ORIGIN}/realms/yadori-operator
      AUTH_AUDIENCE: yadori-api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ../server
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://yadori:${DB_PASSWORD}@db:5432/yadori?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    build:
      context: ../web
      args:
        APP: admin
        VITE_API_BASE_URL: ${API_ORIGIN:?~/.config/yadori/.env に API_ORIGIN を設定してください}/api/v1
        VITE_OIDC_AUTHORITY: ${AUTH_ORIGIN}/realms/yadori-operator
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  booker:
    build:
      context: ../web
      args:
        APP: booker
        VITE_API_BASE_URL: ${API_ORIGIN}/api/v1
        VITE_OIDC_AUTHORITY: ${AUTH_ORIGIN}/realms/yadori-booker
    ports:
      - "127.0.0.1:5174:80"
    restart: unless-stopped

volumes:
  db:
  realms:
